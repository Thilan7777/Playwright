<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            width: 100%;
            margin: 0;
            padding: 0;
            background: white;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            width: 100%;
            margin: 0;
            padding: 0;
            background: white;
        }
        .window {
            width: 100%;
            background: white;
            border-radius: 0;
            box-shadow: none;
        }
        .title-bar {
            background: #0078d4;
            color: white;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .title-bar-left {
            display: flex;
            align-items: center;
        }
        .title-bar-left::before {
            content: '📊';
            margin-right: 8px;
            font-size: 16px;
        }
        .content {
            padding: 30px;
        }
        @media (max-width: 900px) {
            .content {
                padding: 18px;
            }
        }
        @media (max-width: 600px) {
            .content {
                padding: 12px;
            }
            .summary-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
            .window {
                border-radius: 0;
                box-shadow: none;
            }
        }
        .summary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
        }
        .summary-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .summary h2 {
            font-size: 24px;
            margin: 0;
        }
        .new-search-btn {
            background: white;
            color: #667eea;
            border: 2px solid white;
            padding: 8px 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .new-search-btn:hover {
            background: rgba(255, 255, 255, 0.9);
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .new-search-btn:active {
            transform: translateY(0);
        }
        .summary-info {
            display: flex;
            gap: 30px;
            font-size: 14px;
        }
        .summary-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .results-title {
            font-size: 18px;
            font-weight: 700;
            color: #333;
        }
        .export-btn {
            padding: 8px 16px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .export-btn:hover {
            background: #218838;
        }
        .table-container {
            border: 1px solid #d0d0d0;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .table-scroll {
            max-height: 600px;
            overflow-y: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        thead {
            position: sticky;
            top: 0;
            z-index: 10;
        }
        th {
            background: #f8f9fa;
            padding: 12px 10px;
            text-align: left;
            font-weight: 700;
            border-bottom: 2px solid #d0d0d0;
            color: #333;
        }
        td {
            padding: 10px;
            border-bottom: 1px solid #e9ecef;
            word-break: break-word;
        }
        tbody tr:hover {
            background: #f8f9fa;
        }
        tbody tr:nth-child(even) {
            background: #fafbfc;
        }
        tbody tr:nth-child(even):hover {
            background: #f1f3f5;
        }
        .row-num {
            width: 50px;
            text-align: center;
            font-weight: 600;
            color: #666;
        }
        .path-cell {
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 12px;
            color: #0066cc;
        }
        .md5-cell {
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 11px;
            color: #666;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .copy-container {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .copy-btn {
            background: #f0f0f0;
            border: 1px solid #d0d0d0;
            border-radius: 3px;
            padding: 2px 6px;
            cursor: pointer;
            font-size: 11px;
            color: #666;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .copy-btn:hover {
            background: #e0e0e0;
            color: #333;
            border-color: #b0b0b0;
        }
        .copy-btn:active {
            background: #d0d0d0;
            transform: scale(0.95);
        }
        .copy-btn.copied {
            background: #28a745;
            color: white;
            border-color: #28a745;
        }
        .actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .action-btn {
            flex: 1;
            padding: 12px;
            border: 1px solid #d0d0d0;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Segoe UI', sans-serif;
            transition: all 0.2s;
        }
        .action-btn.primary {
            background: #0078d4;
            color: white;
            border-color: #0078d4;
        }
        .action-btn.primary:hover {
            background: #106ebe;
        }
        .action-btn.secondary {
            background: white;
            color: #333;
        }
        .action-btn.secondary:hover {
            background: #f0f0f0;
        }
        .loading {
            text-align: center;
            padding: 60px;
            color: #666;
        }
        .loading::before {
            content: '⏳';
            font-size: 48px;
            display: block;
            margin-bottom: 20px;
        }
        /* New Process Navigation Styles */
        .process-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
            padding: 10px;
            background: #eef2f5;
            border-radius: 6px;
            border: 1px solid #dce1e6;
        }
        .process-nav-label {
            width: 100%;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #666;
            margin-bottom: 5px;
            font-weight: 700;
        }
        .process-btn {
            background: white;
            border: 1px solid #ccc;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            color: #333;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
        }
        .process-btn:hover {
            background: #f0f0f0;
            border-color: #999;
        }
        .process-btn.active {
            background: #0078d4;
            color: white;
            border-color: #0078d4;
            font-weight: 600;
            cursor: default;
        }
    </style>
</head>
<body>
    <div class="window">
        <div class="title-bar">
            <div class="title-bar-left">
                Process Search Results
            </div>
            <div id="timestamp"></div>
        </div>
        <div class="content">
            <div id="loadingMessage" class="loading">
                <div>Loading results...</div>
            </div>
            
            <div id="processNavContainer" class="process-nav" style="display: none;">
                <div class="process-nav-label">🔎 Currently viewing process results. Switch to:</div>
                <!-- Buttons will be injected here -->
            </div>
            
            <div id="resultsContent" style="display: none;">
                <div class="summary">
                    <div class="summary-header">
                        <h2 id="processTitle">🔍 Results for: <span id="processName"></span></h2>
                        <button class="new-search-btn" onclick="newSearch()">🔄 New Search</button>
                    </div>
                    <div class="summary-info">
                        <div class="summary-item">
                            <strong>📦 Total Results:</strong>
                            <span id="totalCount">0</span>
                        </div>
                        <div class="summary-item">
                            <strong>🕒 Search Time:</strong>
                            <span id="searchTime">-</span>
                        </div>
                        <div class="summary-item">
                            <strong>📄 Found on Page:</strong>
                            <span id="foundOnPage">-</span>
                        </div>
                        <div class="summary-item">
                            <strong>🔤 Letter:</strong>
                            <span id="foundLetter">-</span>
                        </div>
                    </div>
                </div>
                
                <div class="results-header">
                    <div class="results-title">📋 File Path Details</div>
                    <button class="export-btn" onclick="exportToCSV()">💾 Export to CSV</button>
                </div>
                
                <div class="table-container">
                    <div class="table-scroll">
                        <table id="resultsTable">
                            <thead>
                                <tr>
                                    <th class="row-num">#</th>
                                    <th>Path</th>
                                    <th>Product Name</th>
                                    <th>Vendor</th>
                                    <th>Version</th>
                                    <th>Size</th>
                                    <th>MD5</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody">
                            </tbody>
                        </table>
                    </div>
                </div>
                
                <div class="actions">
                    <button class="action-btn secondary" onclick="printResults()">🖨️ Print Results</button>
                    <button class="action-btn primary" onclick="newSearch()">🔄 New Search</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let resultsData = null;
        // Cache to store results for all processes
        window.allResultsCache = {};

        // Function called by Playwright to load results
        window.loadResults = (data) => {
            resultsData = data;
            
            // Add self to cache
            if (data.processName) {
                window.allResultsCache[data.processName] = data;
            }
            
            displayResults(data);
        };

        // Function called by Playwright after all searches complete
        window.updateAllResults = (allResultsList) => {
            console.log('Received full results update', allResultsList);
            allResultsList.forEach(item => {
                if (item && item.processName) {
                    window.allResultsCache[item.processName] = item;
                    
                    // Also ensure allProcessNames is populated in the item if missing
                    if (!item.allProcessNames) {
                        item.allProcessNames = allResultsList.map(r => r.processName);
                    }
                }
            });
            
            // Re-render buttons if we have more data now
            // But don't switch the current view, just refresh buttons
            if (resultsData) {
                // Ensure current view has the full list of names now
                resultsData.allProcessNames = allResultsList.map(r => r.processName);
                displayResults(resultsData);
            }
            
            // Visual notification
            const navLabel = document.querySelector('.process-nav-label');
            if (navLabel) {
                 navLabel.textContent = '✅ All searches completed. Switch to other process results:';
                 navLabel.style.color = '#28a745';
            }
        };

        function displayResults(data) {
            // Hide loading, show content
            document.getElementById('loadingMessage').style.display = 'none';
            document.getElementById('resultsContent').style.display = 'block';
            
            // Update page title to show process name
            document.title = data.processName;
            
            // Update summary
            document.getElementById('processName').textContent = data.processName;
            document.getElementById('searchTime').textContent = data.searchTime || '-';
            document.getElementById('foundOnPage').textContent = data.foundOnPage !== null && data.foundOnPage !== undefined ? data.foundOnPage : '-';
            document.getElementById('foundLetter').textContent = data.letter || '-';
            document.getElementById('timestamp').textContent = new Date().toLocaleString();

            // Render Process Navigation buttons
            if (data.allProcessNames && data.allProcessNames.length > 1) {
                const navContainer = document.getElementById('processNavContainer');
                navContainer.style.display = 'flex';
                
                // Clear existing buttons and add label
                navContainer.innerHTML = '';
                
                const label = document.createElement('div');
                label.className = 'process-nav-label';
                label.textContent = '🔍 Switch to other process results:';
                navContainer.appendChild(label);
                
                data.allProcessNames.forEach(proc => {
                    const btn = document.createElement('button');
                    const isActive = proc.toLowerCase() === data.processName.toLowerCase();
                    
                    btn.className = `process-btn ${isActive ? 'active' : ''}`;
                    
                    // Determine status mark
                    let statusMark = '';
                    const cachedResult = window.allResultsCache && window.allResultsCache[proc];
                    
                    // Choose colors based on active state (Active=Blue bg, Inactive=White bg)
                    const successColor = isActive ? '#b3ffb3' : '#28a745';
                    const failColor = isActive ? '#ffcccc' : '#dc3545';
                    
                    // Determine if found or not (using cache, or current data if fallback)
                    let isNotFound = undefined;
                    if (cachedResult) {
                        isNotFound = cachedResult.notFound;
                    } else if (isActive) {
                        isNotFound = data.notFound;
                    }
                    
                    if (isNotFound !== undefined) {
                        if (isNotFound) {
                             statusMark = ` <span style="font-weight: bold; color: ${failColor}; margin-left: 5px;">✘</span>`; 
                        } else {
                             statusMark = ` <span style="font-weight: bold; color: ${successColor}; margin-left: 5px;">✔</span>`;
                        }
                    }

                    btn.innerHTML = `<span>${proc}</span>${statusMark}`;
                    btn.title = isActive ? 'Current Tab' : `Switch to ${proc}`;
                    
                    if (isActive) {
                        btn.disabled = true;
                    } else {
                        btn.onclick = () => {
                            // Check if we have the data in cache
                            const cached = window.allResultsCache[proc];
                            
                            if (cached) {
                                // We have the data! render it immediately
                                console.log(`Switching view to ${proc}`);
                                displayResults(cached);
                                
                                // Update URL hash for better browser history/feel
                                window.location.hash = proc;
                            } else {
                                // Data not valid or not loaded yet
                                alert(`Results for "${proc}" are not fully loaded in this tab yet.\n\nPlease wait for all searches to complete.`);
                            }
                        };
                    }
                    navContainer.appendChild(btn);
                });
            } else {
                document.getElementById('processNavContainer').style.display = 'none';
            }
            
            // Check if process was not found
            if (data.notFound) {
                document.getElementById('totalCount').textContent = '0';
                document.getElementById('foundOnPage').textContent = '-';
                document.getElementById('foundLetter').textContent = '-';
                document.querySelector('.results-header').style.display = 'none';
                document.querySelector('.table-container').style.display = 'none';
                document.querySelector('.actions .secondary').style.display = 'none';
                
                // Add a not found message
                const tableContainer = document.querySelector('.table-container');
                if (tableContainer.nextElementSibling && tableContainer.nextElementSibling.classList.contains('not-found-message')) {
                    // Already exists
                } else {
                    const notFoundDiv = document.createElement('div');
                    notFoundDiv.className = 'not-found-message';
                    notFoundDiv.innerHTML = `
                        <div style="text-align: center; padding: 60px; color: #666;">
                            <div style="font-size: 64px; margin-bottom: 20px;">❌</div>
                            <h3 style="font-size: 24px; margin-bottom: 10px; color: #333;">Process Not Found</h3>
                            <p style="font-size: 16px; margin-bottom: 20px;">
                                The process "<strong>${data.processName}</strong>" was not found in the ProcessChecker database.
                            </p>
                            <p style="font-size: 14px; color: #888;">
                                Please verify the process name and try again.<br>
                                Note: Process names are case-insensitive but must be exact matches.
                            </p>
                        </div>
                    `;
                    tableContainer.parentNode.insertBefore(notFoundDiv, tableContainer.nextSibling);
                }
                return;
            }
            
            // Normal results display
            document.getElementById('totalCount').textContent = data.data.length;
            document.querySelector('.results-header').style.display = 'flex';
            document.querySelector('.table-container').style.display = 'block';
            document.querySelector('.actions .secondary').style.display = 'inline-flex';
            
            // Remove not found message if it exists
            const notFoundMsg = document.querySelector('.not-found-message');
            if (notFoundMsg) {
                notFoundMsg.remove();
            }
            
            // Build table rows
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            data.data.forEach((row, index) => {
                const tr = document.createElement('tr');
                
                // Escape function to preserve backslashes and quotes
                const escapeHtml = (str) => {
                    const div = document.createElement('div');
                    div.textContent = str;
                    return div.innerHTML;
                };
                
                const escapeForJs = (str) => {
                    return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"');
                };
                
                tr.innerHTML = `
                    <td class="row-num">${index + 1}</td>
                    <td class="path-cell" title="${escapeHtml(row.path)}">
                        <div class="copy-container">
                            <span style="flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;">${escapeHtml(row.path)}</span>
                            <button class="copy-btn" onclick="copyToClipboard('${escapeForJs(row.path)}', this)" title="Copy path">📋</button>
                        </div>
                    </td>
                    <td title="${escapeHtml(row.productName)}">
                        <div class="copy-container">
                            <span style="flex: 1; min-width: 0;">${escapeHtml(row.productName)}</span>
                            <button class="copy-btn" onclick="copyToClipboard('${escapeForJs(row.productName)}', this)" title="Copy product name">📋</button>
                        </div>
                    </td>
                    <td>${escapeHtml(row.vendor)}</td>
                    <td>${escapeHtml(row.version)}</td>
                    <td>${row.size}</td>
                    <td class="md5-cell" title="${escapeHtml(row.md5)}">${escapeHtml(row.md5)}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function exportToCSV() {
            if (!resultsData) return;
            
            let csv = 'Row,Path,Product Name,Vendor,Version,Size,MD5\n';
            
            resultsData.data.forEach((row, index) => {
                csv += `${index + 1},"${row.path}","${row.productName}","${row.vendor}","${row.version}","${row.size}","${row.md5}"\n`;
            });
            
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${resultsData.processName}_results_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            window.URL.revokeObjectURL(url);
        }

        function printResults() {
            window.print();
        }

        function copyToClipboard(text, button) {
            navigator.clipboard.writeText(text).then(() => {
                // Visual feedback
                const originalText = button.textContent;
                button.textContent = '✓';
                button.classList.add('copied');
                
                setTimeout(() => {
                    button.textContent = originalText;
                    button.classList.remove('copied');
                }, 1500);
            }).catch(err => {
                console.error('Failed to copy:', err);
                alert('Failed to copy to clipboard');
            });
        }

        function newSearch() {
            // Get the current URL and replace results.html with input-form.html
            const currentUrl = window.location.href;
            const inputFormUrl = currentUrl.replace('results.html', 'input-form.html');
            
            // Navigate to input form (this will convert the current tab to an input form)
            window.location.href = inputFormUrl;
        }
    </script>
</body>
</html>
